<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <title>Yoop - Connect, Share, Discover</title>
    <meta name="description" content="Join Yoop, the social media platform where you can connect with friends, share moments, and discover exciting content tailored to your interests.">
    
    <!-- SEO Meta Tags -->
    <meta name="author" content="Yoop Team">
    <meta name="robots" content="index, follow">
    <meta name="keywords" content="social media, social network, connect, friends, share, reels, videos, stories, messaging">
    <link rel="canonical" href="https://yoop.app/">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yoop.app/">
    <meta property="og:title" content="Yoop - Connect, Share, Discover">
    <meta property="og:description" content="Join Yoop, the social media platform where you can connect with friends, share moments, and discover exciting content.">
    <meta property="og:image" content="https://yoop.app/og-image.jpg">
    <meta property="og:site_name" content="Yoop">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://yoop.app/">
    <meta name="twitter:title" content="Yoop - Connect, Share, Discover">
    <meta name="twitter:description" content="Join Yoop, the social media platform where you can connect with friends, share moments, and discover exciting content.">
    <meta name="twitter:image" content="https://yoop.app/twitter-image.jpg">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1877F2" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Yoop">
    <meta name="application-name" content="Yoop">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Preconnect to important domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Define JSON-LD for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Yoop",
        "url": "https://yoop.app",
        "description": "A social media platform where you can connect with friends, share moments, and discover exciting content.",
        "applicationCategory": "SocialNetworking",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "operatingSystem": "Web"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif;">
        <h1>JavaScript is required</h1>
        <p>Please enable JavaScript to use Yoop.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
